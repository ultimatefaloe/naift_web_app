{% extends "voting/base.html" %}

{% block title %}You Have Voted · NAIFT Voting{% endblock %}

{% block content %}
<div class="mx-auto  py-16 text-center">

    <div class="mx-auto mb-6 grid h-16 w-16 place-items-center bg-success-soft text-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" class="h-8 w-8">
            <path d="M5 13l4 4L19 7"/>
        </svg>
    </div>

    <h1 class="mb-3 font-display text-3xl font-semibold text-brand-black">You Have Voted</h1>
    <p class="text-base text-neutral-600">
        Thank you for voting. You have already submitted your vote for this election.
    </p>

    <div class="mt-8 flex justify-center gap-3">
        <a href="{% url 'voting:results' %}" class="btn btn-primary">View Results</a>
    </div>
</div>
{% endblock %}
