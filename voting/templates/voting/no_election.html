{% extends "voting/base.html" %}

{% block title %}No Active Election · NAIFT Voting{% endblock %}

{% block content %}
<div class="mx-auto py-16 text-center">

    <div class="mx-auto mb-6 grid h-16 w-16 place-items-center bg-brand-purple-soft text-brand-purple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-8 w-8">
            <rect x="3" y="5" width="18" height="16"/>
            <path d="M3 9h18M8 3v4M16 3v4"/>
        </svg>
    </div>

    <h1 class="mb-3 font-display text-3xl font-semibold text-brand-black">No Active Election</h1>
    <p class="text-base text-neutral-600">
        There is no election open for voting right now. Please check back later.
    </p>

    <div class="mt-8 flex justify-center gap-3">
        <a href="{% url 'voting:results_archive' %}" class="btn btn-outline">Past Results</a>
        <a href="{% url 'core:home' %}" class="btn btn-primary">Public Site</a>
    </div>
</div>
{% endblock %}
